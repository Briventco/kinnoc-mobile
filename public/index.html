<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>

    <!-- Open Graph & Social Cards -->
    <meta property="og:site_name" content="Kinnoc" />
    <meta property="og:title" content="Kinnoc — Connect, Chat, and Discover" />
    <meta property="og:description" content="Join communities, participate in conversations, share updates, and discover local events on Kinnoc." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://web.kinnoc.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kinnoc — Connect, Chat, and Discover" />
    <meta name="twitter:description" content="Join communities, participate in conversations, share updates, and discover local events on Kinnoc." />
    <meta name="twitter:image" content="https://web.kinnoc.app/icons/icon-512.png" />

    <!-- PWA Manifest & Web App Metadata -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preload" as="image" href="/splash-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- iOS & Android PWA Directives -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kinnoc" />
    <meta name="application-name" content="Kinnoc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="msapplication-TileColor" content="#FFFFFF" />

    <!-- The react-native-web recommended style reset -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        display: flex;
        height: 100%;
        width: 100%;
        flex: 1;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
      /* Eliminate blue focus ring / box line across all browsers */
      *, *:focus, *:focus-visible, *:active {
        -webkit-tap-highlight-color: transparent !important;
      }
      input, textarea, select, button, [contenteditable], [role="textbox"] {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent !important;
      }
      input:focus, input:focus-visible,
      textarea:focus, textarea:focus-visible,
      select:focus, select:focus-visible,
      button:focus, button:focus-visible,
      [contenteditable]:focus, [role="textbox"]:focus {
        outline: none !important;
        outline-width: 0 !important;
        box-shadow: none !important;
        -webkit-tap-highlight-color: transparent !important;
      }
      #kinnoc-splash {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        position: relative;
      }
      #kinnoc-splash p {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
        margin: 0;
        color: #5e6a82;
        font: 500 15px/20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #kinnoc-splash b {
        font-weight: 700;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
      Instant splash: painted before the app's JavaScript arrives, and identical to the in-app
      splash (BrandSplash: the 76px mark, "from Brivent" at the foot). React replaces everything
      inside #root on its first render, so it disappears exactly when the app takes over.
    -->
    <div id="root">
      <div id="kinnoc-splash" aria-label="Kinnoc is loading" role="img">
        <img src="/splash-icon.png" width="76" height="76" alt="" fetchpriority="high" />
        <p>from <b>Brivent</b></p>
      </div>
    </div>
  </body>
</html>
